name: Build and test
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-14]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Install build prerequisites (Ubuntu)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config
      - name: Build pinned SDK and install serial runtime
        run: python3 scripts/setup.py
      - name: Packet and controller tests
        shell: bash
        run: |
          source scripts/build-env.sh
          cargo test --locked
          .venv/bin/python -m unittest discover -s tests -v
      - name: Pairing portability
        run: bash scripts/pair.sh "$RUNNER_TEMP/test-position-credentials"
      - name: LeRobot calibration CLI imports
        run: .venv/bin/python -m lerobot.scripts.lerobot_calibrate --help
      - name: Install GStreamer test runtime (Ubuntu)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get install -y python3-gi gir1.2-gstreamer-1.0 gstreamer1.0-tools gstreamer1.0-plugins-base gstreamer1.0-plugins-good gstreamer1.0-plugins-bad gstreamer1.0-plugins-ugly gstreamer1.0-libav
      - name: Kyber commands and H.264 video integration (Ubuntu)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          source scripts/build-env.sh
          .venv/bin/python scripts/smoke.py
          .venv/bin/python scripts/test-camera-startup.py
          .venv/bin/python scripts/test-session.py
          .venv/bin/python scripts/test-session.py --insecure-lan
